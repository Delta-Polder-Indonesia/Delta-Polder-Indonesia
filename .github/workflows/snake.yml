# =====================================================
# GitHub Action - Generate GitHub Profile Trophy
# =====================================================
# Fungsi  : Mengambil trophy dari github-profile-trophy
#           dan menyimpannya sebagai file SVG lokal
# Output  : Branch "output" di repo ini
# Update  : Setiap 6 jam sekali (otomatis)
# =====================================================

name: Generate Trophy

# -------------------------------------------------------
# Kapan workflow ini berjalan
# -------------------------------------------------------
on:
  # Otomatis setiap 6 jam
  schedule:
    - cron: "0 */6 * * *"

  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

  # Juga berjalan setiap push ke branch main
  push:
    branches:
      - main

# -------------------------------------------------------
# Izin yang dibutuhkan agar bisa push ke branch output
# -------------------------------------------------------
permissions:
  contents: write

# -------------------------------------------------------
# Job utama
# -------------------------------------------------------
jobs:
  build:
    name: Generate GitHub Trophy
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # Step 1 - Clone repo ini
      # ---------------------------------------------------
      - name: 📥 Clone Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Step 2 - Download trophy SVG dari API
      # ---------------------------------------------------
      - name: 🏆 Download Trophy SVG
        run: |
          mkdir -p dist
          echo "Mengunduh trophy untuk user: ${{ github.repository_owner }}"
          curl -sL "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=tokyonight&no-frame=true&no-bg=true&row=1&margin-w=15"             -o dist/trophy.svg
          echo "File berhasil diunduh:"
          ls -la dist/trophy.svg
          echo ""
          echo "Ukuran file:"
          du -h dist/trophy.svg
          echo ""
          echo "Preview 10 baris pertama:"
          head -10 dist/trophy.svg

      # ---------------------------------------------------
      # Step 3 - Cek status file yang di-generate
      # ---------------------------------------------------
      - name: 📋 Show Build Status
        run: |
          echo "==============================="
          echo "  File yang berhasil dibuat:"
          echo "==============================="
          ls -la dist/
          echo ""
          echo "Git Status:"
          git status

      # ---------------------------------------------------
      # Step 4 - Push file ke branch "output"
      # ---------------------------------------------------
      - name: 🚀 Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🏆 Update trophy SVG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
